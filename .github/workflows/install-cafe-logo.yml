name: Install Tails n Elegance original logo
on:
  push:
    paths:
      - ".github/workflows/install-cafe-logo.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct original brand logo
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib
          paths=sorted(Path('.logo-transfer').glob('part-*.txt'))
          if len(paths)!=6: raise SystemExit('Incomplete logo transfer')
          binary=base64.b64decode(''.join(p.read_text() for p in paths), validate=True)
          if hashlib.sha256(binary).hexdigest()!='10ca283acced8579fcbe08cdaad3a0340f0abeccbf4db3b5303c7a158d3df10e': raise SystemExit('Logo checksum mismatch')
          p=Path('assets/tails-n-elegance-logo.webp')
          p.parent.mkdir(exist_ok=True)
          p.write_bytes(binary)
          print('Verified original logo',len(binary),'bytes')
          PY
      - name: Commit original logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tails-n-elegance-logo.webp
          git rm -r .logo-transfer
          git commit -m "Install original Tails n Elegance logo"
          git push
